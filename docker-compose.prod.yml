version: "3.8"
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://10.0.40.10/api/cobros/api/}
        VITE_LOGIN_API_BASE_URL: ${VITE_LOGIN_API_BASE_URL:-http://10.0.40.10/api}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
        VITE_PAYMENT_FORM_CARD_ID: ${VITE_PAYMENT_FORM_CARD_ID:-1}
        VITE_PAYMENT_ID_START: ${VITE_PAYMENT_ID_START:-6}
        VITE_PAYMENT_PLAN_WEEKDAY_ID: ${VITE_PAYMENT_PLAN_WEEKDAY_ID:-1}
        VITE_PAYMENT_PLAN_SATURDAY_ID: ${VITE_PAYMENT_PLAN_SATURDAY_ID:-2}
        VITE_PAYMENT_PLAN_SUNDAY_ID: ${VITE_PAYMENT_PLAN_SUNDAY_ID:-3}
        VITE_PAYMENT_PLAN_MATUTINO_CARRO_ID: ${VITE_PAYMENT_PLAN_MATUTINO_CARRO_ID:-${VITE_PAYMENT_PLAN_WEEKDAY_ID:-1}}
        VITE_PAYMENT_PLAN_MATUTINO_MOTO_ID: ${VITE_PAYMENT_PLAN_MATUTINO_MOTO_ID:-${VITE_PAYMENT_PLAN_WEEKDAY_ID:-1}}
        VITE_PAYMENT_PLAN_VESPERTINO_CARRO_ID: ${VITE_PAYMENT_PLAN_VESPERTINO_CARRO_ID:-${VITE_PAYMENT_PLAN_WEEKDAY_ID:-1}}
        VITE_PAYMENT_PLAN_VESPERTINO_MOTO_ID: ${VITE_PAYMENT_PLAN_VESPERTINO_MOTO_ID:-${VITE_PAYMENT_PLAN_WEEKDAY_ID:-1}}
    container_name: umg_frontend_prod
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
